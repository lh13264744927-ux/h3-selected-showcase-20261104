.layout{display:grid;grid-template-columns:245px minmax(0,1fr);height:calc(100vh - 83px)}
aside{border-right:1px solid var(--border);overflow:auto;padding:12px}
.pick{display:flex;width:100%;align-items:center;gap:10px;text-align:left;padding:7px;margin:0 0 9px;background:var(--panel);border-color:transparent}
.pick.active{border-color:var(--accent);background:#253750}.pick img{width:82px;height:55px;object-fit:cover;border-radius:5px;background:#000}.pick span{font-size:14px;line-height:1.4}

#meta,#position,#saveState{color:var(--muted);font-size:14px}#saveState{min-height:21px}
.controls{display:flex;align-items:center;gap:8px;margin:14px 0;flex-wrap:wrap}.tabs button.active{background:#354d70;border-color:#7ba4de}
.stage{background:#07090e;border:1px solid var(--border);border-radius:10px;min-height:320px;display:flex;align-items:center;justify-content:center;overflow:hidden}
video,#source{display:block;width:100%;max-height:calc(100vh - 290px);object-fit:contain;background:#07090e}#source[hidden],video[hidden]{display:none}
.empty{padding:70px 20px;text-align:center;color:var(--muted)}[hidden]{display:none!important}
@media(min-width:1900px){main{padding-left:38px;padding-right:38px}.stage{max-width:1560px;margin:auto}}
@media(max-width:850px){.layout{grid-template-columns:1fr;height:auto}aside{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--border);height:100px}.pick{min-width:190px;width:190px;margin:0 8px 0 0}.pick img{width:65px}main{padding:15px}header{padding:12px}.grow{display:none}video,#source{max-height:68vh}.stage{min-height:220px}}
</style>

<script>
'use strict';
const ITEMS=JSON.parse(document.getElementById('items-data').textContent);
const KEY='h3-public-selected-marks-20261104';
const ids=new Set(ITEMS.map(x=>x.id));
const dom=Object.fromEntries(['category','filterMarked','markedCount','list','viewer','empty','title','mark','meta','prev','next','position','videoTab','sourceTab','fullscreen','video','source','saveState','stage','export'].map(k=>[k,document.getElementById(k)]));
let selected=new Set(),current=ITEMS.find(x=>x.id===location.hash.slice(1))?.id||ITEMS[0].id,onlyMarked=false,view='video',serverReady=false,revision=0;
try{selected=new Set(JSON.parse(localStorage.getItem(KEY)||'[]').filter(x=>ids.has(x)));}catch(e){}
function visible(){return ITEMS.filter(x=>(dom.category.value==='all'||x.category===dom.category.value)&&(!onlyMarked||selected.has(x.id)));}
function keepLocal(){try{localStorage.setItem(KEY,JSON.stringify([...selected].sort()));}catch(e){}}
function render(){
 const rows=visible();
 if(!rows.some(x=>x.id===current))current=rows[0]?.id||null;
 dom.list.replaceChildren();
 rows.forEach(item=>{
   const button=document.createElement('button');button.className='pick'+(item.id===current?' active':'');button.dataset.id=item.id;
   const image=document.createElement('img');image.src=item.poster;image.loading='lazy';image.alt='';
   const text=document.createElement('span');text.textContent=(item.display_number||item.id)+' '+item.title;
   if(selected.has(item.id)){const star=document.createElement('b');star.className='star';star.textContent=' ★';text.append(star);}
   button.append(image,text);button.onclick=()=>show(item.id);dom.list.append(button);
 });
 dom.markedCount.textContent=selected.size;dom.filterMarked.setAttribute('aria-pressed',String(onlyMarked));
 dom.viewer.hidden=!current;dom.empty.hidden=!!current;
 if(!current){dom.video.pause();return;}
 const item=ITEMS.find(x=>x.id===current),at=rows.findIndex(x=>x.id===current);
 dom.title.textContent=(item.display_number||item.id)+' · '+item.title;
 dom.meta.textContent=`${item.width}×${item.height} · ${item.duration.toFixed(2)}秒 · ${item.category}`;
 dom.position.textContent=(at+1)+' / '+rows.length;
 dom.prev.disabled=at<=0;dom.next.disabled=at>=rows.length-1;
 const marked=selected.has(item.id);dom.mark.setAttribute('aria-pressed',String(marked));dom.mark.textContent=marked?'✓ 已标记':'☆ 标记';
 if(dom.video.dataset.id!==item.id){
   dom.video.pause();dom.video.dataset.id=item.id;dom.video.src=item.video;dom.video.poster=item.poster;dom.source.src=item.source;dom.video.load();
 }
 setView(view);
 if(location.hash!=='#'+item.id)history.replaceState(null,'','#'+item.id);
}
function show(id){current=id;dom.saveState.textContent='';render();document.querySelector('.pick.active')?.scrollIntoView({block:'nearest',inline:'nearest'});}
function setView(value){view=value;dom.video.hidden=value!=='video';dom.source.hidden=value!=='source';if(value!=='video')dom.video.pause();dom.videoTab.classList.toggle('active',value==='video');dom.sourceTab.classList.toggle('active',value==='source');}
function step(amount){const rows=visible(),index=rows.findIndex(x=>x.id===current),target=rows[index+amount];if(target)show(target.id);}
async function toggleMark(){
 if(!current)return;
 const id=current,wanted=!selected.has(id);wanted?selected.add(id):selected.delete(id);keepLocal();render();
 dom.saveState.textContent='已保存到本浏览器';
 if(serverReady){
   try{
     const response=await fetch('api/marks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,selected:wanted})});
     if(!response.ok)throw Error(response.status);
     const data=await response.json();selected=new Set(data.ids.filter(x=>ids.has(x)));revision=data.revision;keepLocal();render();
     dom.saveState.textContent='已保存到本浏览器';
   }catch(error){dom.saveState.textContent='已保存在本浏览器，可导出标记';}
 }
}
dom.mark.onclick=toggleMark;dom.prev.onclick=()=>step(-1);dom.next.onclick=()=>step(1);
dom.category.onchange=render;
dom.filterMarked.onclick=()=>{onlyMarked=!onlyMarked;render();};
dom.videoTab.onclick=()=>setView('video');dom.sourceTab.onclick=()=>setView('source');
dom.fullscreen.onclick=()=>{const element=view==='video'?dom.video:dom.source;if(element.requestFullscreen)element.requestFullscreen();};
dom.export.onclick=()=>{
 const rows=ITEMS.filter(x=>selected.has(x.id));
 const data={board:'H3较好效果30组_20261104',ids:rows.map(x=>x.id),items:rows,revision};
 const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
 const link=document.createElement('a');link.href=url;link.download='H3本轮标记.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
};
document.addEventListener('keydown',event=>{
 if(['INPUT','SELECT','TEXTAREA','VIDEO'].includes(event.target.tagName))return;
 if(event.key==='ArrowRight'){event.preventDefault();step(1);}
 if(event.key==='ArrowLeft'){event.preventDefault();step(-1);}
 if(event.key.toLowerCase()==='m'){event.preventDefault();toggleMark();}
});
window.addEventListener('hashchange',()=>{if(ids.has(location.hash.slice(1)))show(location.hash.slice(1));});
render();
if(false /* Static public site: browser-local marks only */){
 fetch('api/marks',{cache:'no-store'}).then(response=>{if(!response.ok)throw Error(response.status);return response.json();}).then(data=>{
   selected=new Set(data.ids.filter(x=>ids.has(x)));revision=data.revision;serverReady=true;keepLocal();render();
 }).catch(()=>{});
}
</script>
