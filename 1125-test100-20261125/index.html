function show(id){let row=data.items.find(row=>row.id===id)||data.items[0];if(!row)return;selected=row.id;history.replaceState(null,"","#"+row.id);$("title").textContent=`${row.number} · ${row.space}`;$("video").src=row.video;$("video").muted=true;$("sound").textContent="开启声音";$("info").textContent=`${row.width} × ${row.height} · ${row.fps} fps · ${row.duration.toFixed(2)} 秒`;$("times").textContent=`Dify：${duration(row.dify_seconds)} · 视频：${duration(row.video_seconds)} · 两阶段执行：${duration((row.dify_seconds||0)+(row.video_seconds||0))}`;$("mark").textContent=marks.has(row.id)?"取消标记":"标记此组";render()}
$("mark").onclick=()=>{if(!selected)return;marks.has(selected)?marks.delete(selected):marks.add(selected);localStorage.setItem(key,JSON.stringify([...marks]));$("mark").textContent=marks.has(selected)?"取消标记":"标记此组";render()};
$("export").onclick=()=>{let value={board:data.batch,exported_at:new Date().toISOString(),marked:[...marks].sort()};let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(value,null,2)],{type:"application/json"}));a.download="1125测试集标记.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$("sound").onclick=()=>{$("video").muted=!$("video").muted;$("sound").textContent=$("video").muted?"开启声音":"关闭声音"};
function move(n){let i=data.items.findIndex(row=>row.id===selected);if(data.items.length)show(data.items[(i+n+data.items.length)%data.items.length].id)}
$("prev").onclick=()=>move(-1);$("next").onclick=()=>move(1);
$("refresh").onclick=async()=>{try{let r=await fetch("data.json?v="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error();data=await r.json();render()}catch(e){location.reload()}};
render();
</script>
</html>
