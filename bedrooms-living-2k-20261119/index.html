<script>
'use strict';
const data=JSON.parse(document.getElementById('items-data').textContent);
const $=id=>document.getElementById(id);
const key='h3-bedrooms-living-2k-marks-20261119';
let marks=new Set(),only=false,current=location.hash.slice(1),loaded='',version='2K';
try{marks=new Set(JSON.parse(localStorage.getItem(key)||'[]'));}catch{}
const items=()=>data.items.filter(row=>!only||marks.has(row.id));

$('count').textContent=`${data.items.length} 组 · ${data.items.reduce((sum,row)=>sum+Object.keys(row.variants).length,0)} 段 2K`;
function choose(id){if(current!==id)version='2K';current=id;render();document.querySelector('[aria-current=true]')?.scrollIntoView({block:'nearest',inline:'nearest'});}
function render(){
 const rows=items();
 if(!rows.some(row=>row.id===current)){current=rows[0]?.id||'';version='2K';}
 $('list').replaceChildren();
 for(const row of rows){
   const button=document.createElement('button');
   button.textContent=`${row.number} ${row.space}${marks.has(row.id)?' ★':''}`;
   button.setAttribute('aria-current',String(row.id===current));button.onclick=()=>choose(row.id);$('list').append(button);
 }
 $('only').setAttribute('aria-pressed',String(only));$('only').textContent=`只看已标记 ${marks.size}`;
 $('content').hidden=!current;$('empty').hidden=!!current;
 if(!current){$('player').pause();return;}
 const i=rows.findIndex(row=>row.id===current),row=rows[i];
 if(!row.variants[version])version='2K';
 const v=row.variants[version],entries=Object.entries(row.variants);
 $('versionBar').hidden=entries.length<2;$('version').replaceChildren();
 for(const [key,value] of entries){const option=document.createElement('option');option.value=key;option.textContent=value.label||'原批次 2K';$('version').append(option);}
 $('version').value=version;
 $('title').textContent=`${row.number} · ${row.space}`;
 $('feedback').textContent=(row.feedback||[]).map(t=>'已反馈：'+t).join('；');
 $('prev').disabled=i===0;$('next').disabled=i===rows.length-1;
 $('mark').setAttribute('aria-pressed',String(marks.has(row.id)));
 $('mark').textContent=marks.has(row.id)?'✓ 已标记':'☆ 标记';
 if(loaded!==row.id+':'+version){
   $('player').pause();$('player').src=v.video;loaded=row.id+':'+version;
   $('videoLabel').textContent=`${v.label||'2K 成片'} · ${v.width}×${v.height} · ${v.duration.toFixed(2)} 秒`;
   $('total').textContent=`${v.elapsed_label||'生成总耗时'}：${fmt(v.elapsed??row.elapsed)} · 分阶段明细`;

 }
 if(location.hash!=='#'+current)history.replaceState(null,'','#'+current);
